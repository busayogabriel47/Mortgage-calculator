<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Mortgage Calculator</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>

  <div class="mortgage">
    <div class="mortgage__container">
      <div class="mortgage__main">

        <!-- Mortgage Form -->
        <form class="mortgage__form">
          <div class="mortgage__form__header">
            <h5>Mortgage Calculator</h5>
            <button type="reset" class="clear-btn">Clear All</button>
          </div>

          <!-- Mortgage Amount -->
          <div class="form-group">
            <label for="amount">Mortgage Amount</label>
            <input type="text" id="amount" name="amount" />
          </div>

          <!-- Term and Rate -->
          <div class="form-row">
            <div class="form-group">
              <label for="term">Term (Years)</label>
              <input type="text" id="term" name="term" />
            </div>
            <div class="form-group">
              <label for="rate">Interest Rate (%)</label>
              <input type="text" id="rate" name="rate" />
            </div>
          </div>

          <!-- Mortgage Type -->
          <fieldset class="mortgage__type">
            <legend>Mortgage Type</legend>
            <label class="mortgage__type_option">
              <input type="radio" name="type" value="repayment" />
              Repayment
            </label>
            <label class="mortgage__type_option">
              <input type="radio" name="type" value="interest" />
              Interest Only
            </label>
          </fieldset>

          <!-- Calculate Button -->
          <div class="mortgage__btn">
            <button type="submit">
              <img src="./assets/cal.png" alt="calculator" width="20" />
              Calculate Repayment
            </button>
          </div>
        </form>

        <!-- Result Section -->
        <div class="mortgage__result">
          <img src="./assets/empty.png" alt="No result" width="40%" />
          <h2>Results shown here</h2>
        </div>

      </div>
    </div>
  </div>

</body>
</html>
